<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Title card. Sized to the viewport so one file works at any resolution. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100vw; height:100vh; overflow:hidden; }
  body { background:#FBFAF3; color:#1E293B; font-family:Inter,system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center;
         -webkit-font-smoothing:antialiased; }
  .wrap { width:74%; }
  .eyebrow { font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:#64748B; }
  .lead { font-size:76px; line-height:1.06; margin-top:38px; letter-spacing:-.015em; font-weight:600; }
  .rule { height:1px; width:420px; margin:44px 0 28px;
          background:linear-gradient(to right,#C0982A,rgba(192,152,42,.15),transparent); }
  .sub { font-size:26px; font-weight:300; color:#475569; }
</style></head>
<body><div class="wrap">
  <div class="eyebrow">BRAND NAME</div>
  <div class="lead">The line that<br>stops the scroll.</div>
  <div class="rule"></div>
  <div class="sub">The turn underneath it.</div>
</div></body></html>
